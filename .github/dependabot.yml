version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/functions-user-admin"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 4
    groups:
      firebase-compatible-updates:
        patterns:
          - "firebase-admin"
          - "firebase-functions"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/tests"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 4

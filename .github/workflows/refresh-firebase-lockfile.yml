name: Refresh Firebase Functions lockfile

on:
  push:
    branches:
      - maintenance/firebase-dependency-ci-2026-11
    paths:
      - functions-user-admin/package.json

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve and lock current Firebase versions
        working-directory: functions-user-admin
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Confirm locked dependencies install
        working-directory: functions-user-admin
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated lockfile only on the maintenance branch
        run: |
          if git diff --quiet -- functions-user-admin/package-lock.json; then
            echo "Lockfile already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions-user-admin/package-lock.json
          git commit -m "build: regenerate Firebase Functions lockfile"
          git push origin HEAD:maintenance/firebase-dependency-ci-2026-11

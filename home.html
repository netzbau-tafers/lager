<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Startseite | Lagermanager</title>

<link rel="icon" type="image/png" sizes="any" href="favicon.png">
<link rel="shortcut icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon.png">
<link rel="manifest" href="site.webmanifest">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
  font-family:Arial, sans-serif;
  background:#e6eaef;
  margin:40px;
  color:#222;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
  gap:15px;
}

.header h1{
  margin:0;
}

.menu-wrap{
  position:relative;
}

.menu-button{
  background:#555;
  color:white;
  border:none;
  border-radius:10px;
  padding:11px 15px;
  font-size:20px;
  line-height:1;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:48px;
  min-height:44px;
  box-shadow:0 2px 6px rgba(0,0,0,0.10);
}

.menu-button:hover{
  background:#333;
}

.dropdown-menu{
  display:none;
  position:absolute;
  top:52px;
  right:0;
  min-width:220px;
  background:white;
  border:1px solid #ccc;
  border-radius:12px;
  box-shadow:0 8px 20px rgba(0,0,0,0.12);
  padding:8px;
  z-index:3000;
}

.dropdown-menu.open{
  display:block;
}

.active-page{
  background:#e0e0e0 !important;
  color:#333 !important;
  cursor:default;
}

button{
  padding:10px 14px;
  cursor:pointer;
  border:none;
  border-radius:8px;
  background:#3498db;
  color:white;
  margin:2px;
  font-size:14px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

button:hover{
  background:#2980b9;
}

.dropdown-menu button{
  width:100%;
  text-align:left;
  margin:0 0 8px 0;
}

.dropdown-menu button:last-child{
  margin-bottom:0;
}

.logout-safe{
  background:#777;
}

.logout-safe:hover{
  background:#555;
}

.login-screen{
  display:none;
  align-items:center;
  justify-content:center;
  min-height:80vh;
}

.login-card{
  background:white;
  border:1px solid #d7dce2;
  border-radius:14px;
  width:360px;
  max-width:92%;
  padding:22px;
  box-shadow:0 8px 22px rgba(0,0,0,0.08);
}

.login-card h2{
  margin-top:0;
  text-align:center;
}

.login-card input{
  width:100%;
  padding:10px;
  margin:6px 0 10px 0;
  box-sizing:border-box;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:15px;
}

.login-error{
  color:#c0392b;
  display:none;
  margin-top:10px;
  text-align:center;
}

.login-success{
  color:#1e824c;
  display:none;
  margin-top:10px;
  text-align:center;
}

.login-info{
  color:#555;
  font-size:14px;
  text-align:center;
  margin-bottom:15px;
}

.hero{
  max-width:1100px;
  margin:0 auto;
  background:white;
  border:1px solid #d5dbe3;
  border-radius:14px;
  box-shadow:0 8px 22px rgba(0,0,0,0.08);
  overflow:hidden;
}

.hero-actions{
  display:flex;
  gap:12px;
  padding:16px;
  justify-content:center;
  background:#f5f7fa;
  border-bottom:1px solid #e1e6ed;
  flex-wrap:wrap;
}

.hero-link{
  text-decoration:none;
}

.hero-image-wrap{
  position:relative;
}

.hero-game-link{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:33.34%;
  z-index:5;
}

.hero-image{
  width:100%;
  height:auto;
  display:block;
}

.home-infos{
  padding:20px;
  border-top:1px solid #e1e6ed;
  background:#fcfdff;
}

.home-infos h2{
  margin:0 0 6px 0;
  font-size:22px;
}

.infos-meta{
  margin:0 0 14px 0;
  color:#66727f;
  font-size:13px;
}

.infos-list{
  margin:0;
  padding-left:20px;
  display:grid;
  gap:8px;
}

.infos-list li{
  line-height:1.4;
}

.infos-status{
  color:#8a1f17;
  background:#fdecea;
  border:1px solid #f3c4bd;
  border-radius:8px;
  padding:10px 12px;
  font-size:14px;
}

@media (max-width: 680px){
  body{
    margin:18px;
  }

  .hero-actions{
    flex-direction:column;
    align-items:stretch;
  }

  .hero-actions button{
    width:100%;
  }
}

.app-footer{
  margin:32px auto 0;
  max-width:1100px;
  padding:14px 18px;
  text-align:center;
  color:#5b6570;
  font-size:14px;
}

@media (max-width: 680px){
  .app-footer{
    margin-top:24px;
    padding:12px 10px;
    font-size:13px;
  }
}
</style>
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <h2>Login Startseite</h2>
      <div class="login-info">Bitte mit E-Mail und Passwort anmelden</div>
      <input id="loginEmail" type="email" placeholder="E-Mail" maxlength="120" autocomplete="username">
    <div style="position:relative; margin-top:10px;">
      <input id="loginPassword" type="password" placeholder="Passwort" maxlength="120" autocomplete="current-password" style="margin:0; padding-right:44px;">
      <button type="button" onclick="toggleLoginPasswordVisibility()" aria-label="Passwort anzeigen oder ausblenden" title="Passwort anzeigen oder ausblenden" style="position:absolute; right:8px; top:50%; transform:translateY(-50%); background:transparent; color:#666; box-shadow:none; padding:6px; margin:0; min-width:auto;">
        <i id="loginPasswordToggleIcon" class="fa-regular fa-eye"></i>
      </button>
    </div>
      <button onclick="login()"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
      <p id="loginError" class="login-error">Login fehlgeschlagen. Bitte Daten prüfen.</p>
      <p id="loginSuccess" class="login-success"></p>
    </div>
  </div>

  <div id="appContent" style="display:none;">
  <div class="header">
    <h1>Startseite</h1>

    <div class="menu-wrap">
      <button class="menu-button" onclick="toggleMenu(event)" title="Menü öffnen">
        <i class="fa-solid fa-bars"></i>
      </button>

      <div id="dropdownMenu" class="dropdown-menu">
        <button onclick="closeMenu()" data-page="home">
          <i class="fa-solid fa-house"></i> Startseite
        </button>

        <button onclick="goToKabellager()" data-page="index">
          <i class="fa-solid fa-warehouse"></i> Kabellager
        </button>

        <button onclick="goToKabelReport()" data-page="kabelreport">
          <i class="fa-solid fa-chart-column"></i> Kabel Report
        </button>

        <button id="baustellenMenuButton" onclick="goToBaustellen()" data-page="baustellen">
          <i class="fa-solid fa-screwdriver-wrench"></i> Baustellenmaterial
        </button>

        <button id="archivMenuButton" onclick="goToArchiv()" data-page="archiv" style="display:none;">
          <i class="fa-solid fa-box-archive"></i> Archiv
        </button>

        <button id="logsMenuButton" onclick="goToLogs()" data-page="logs" style="display:none;">
          <i class="fa-solid fa-clipboard-list"></i> Logs
        </button>

        <button id="gespartMenuButton" onclick="goToGespart()" data-page="gespart" style="display:none;">
          <i class="fa-solid fa-piggy-bank"></i> Kosten gespart
        </button>

        <button onclick="goToProfile()">
          <i class="fa-solid fa-user"></i> Profil
        </button>
        <button class="logout-safe" onclick="logout()">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
      </div>
    </div>
  </div>

  <section class="hero">
    <div class="hero-actions">
      <a href="index.html" class="hero-link">
        <button><i class="fa-solid fa-warehouse"></i>Kabellager</button>
      </a>
      <a id="baustellenHeroLink" href="baustellen.html" class="hero-link">
        <button><i class="fa-solid fa-screwdriver-wrench"></i>Baustellenmaterial</button>
      </a>
    </div>

    <div class="hero-image-wrap">
      <img src="ChatGPT Image 10. März 2026, 21_46_18.png" alt="Startseitenbild" class="hero-image">
      <a href="strommast-game.html" class="hero-game-link" aria-label="Mast Runner öffnen"></a>
    </div>

    <section class="home-infos" aria-live="polite">
      <h2 id="infosTitle">Aktuelle Infos</h2>
      <p id="infosMeta" class="infos-meta"></p>
      <ul id="infosList" class="infos-list"></ul>
      <p id="infosStatus" class="infos-status" style="display:none;"></p>
    </section>
  </section>
  </div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAfmH7jDf1kZQpk-Psbl2kvAvzZj3jGX-w",
  authDomain: "netzbau-tafers.firebaseapp.com",
  projectId: "netzbau-tafers",
  storageBucket: "netzbau-tafers.appspot.com",
  messagingSenderId: "389541837675",
  appId: "1:389541837675:web:db580ce67c57a9a16dea2e",
  measurementId: "G-B5MJGD3108"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const authReady = auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
  .catch((error) => {
    console.error("Auth-Persistenz konnte nicht gesetzt werden:", error);
  });
const ADMIN_UIDS = ["smnnQd4RhEQZR3uuNN0otNALUqi1", "pmyu29TlC3QM7JIysmy2EmiHSWW2", "Tgj9KT6C21XjeistBWRiSVYqTDC2", "hwZEme8xvkasSAGrmOtQRLOnnXn1", "PKDpb7Cb7ig8ZKZRMm23FOKnCHQ2", "PAtM8Lv1TBNLSiQzBLJK9Oda8KK2", "DSMERv7Uu4b4eEYQx5SKbjvdher2"];
const LIMITED_ACCESS_UIDS = ["POSB6W7xeDZ8Dlba03ZP3J02dMC3", "AX08qKp7lte6vslQMFn76FVqxw53", "KYqiqNKTmkQQYVWAa6bp6vSvTlV2"];
const isAdminUid = (uid) => ADMIN_UIDS.includes(uid);
const hasLimitedAccess = (uid) => LIMITED_ACCESS_UIDS.includes(uid);
const SPECIAL_SAVINGS_UID = "pmyu29TlC3QM7JIysmy2EmiHSWW2";
const canAccessSavingsPage = (uid) => uid === SPECIAL_SAVINGS_UID;
const HOME_INFOS_URL = "home-infos.json";


function setNavigationVisibility(user){
  const isAdminUser = !!(user && isAdminUid(user.uid));
  const isLimitedUser = !!(user && hasLimitedAccess(user.uid));
  const archivButton = document.getElementById("archivMenuButton");
  const logsButton = document.getElementById("logsMenuButton");
  const baustellenButton = document.getElementById("baustellenMenuButton");
  const baustellenHeroLink = document.getElementById("baustellenHeroLink");
  const gespartButton = document.getElementById("gespartMenuButton");

  if(archivButton){
    archivButton.style.display = isAdminUser && !isLimitedUser ? "inline-flex" : "none";
  }

  if(logsButton){
    logsButton.style.display = isAdminUser && !isLimitedUser ? "inline-flex" : "none";
  }

  if(baustellenButton){
    baustellenButton.style.display = isLimitedUser ? "none" : "inline-flex";
  }

  if(baustellenHeroLink){
    baustellenHeroLink.style.display = isLimitedUser ? "none" : "inline-flex";
  }

  if(gespartButton){
    gespartButton.style.display = user && canAccessSavingsPage(user.uid) && !isLimitedUser ? "inline-flex" : "none";
  }
}

function toggleMenu(event){
  event.stopPropagation();
  const menu = document.getElementById("dropdownMenu");
  menu.classList.toggle("open");
}

function closeMenu(){
  const menu = document.getElementById("dropdownMenu");
  menu.classList.remove("open");
}

function goToKabellager(){
  closeMenu();
  window.location.href = "index.html";
}

function goToBaustellen(){
  const user = auth.currentUser;
  if(user && hasLimitedAccess(user.uid)){
    closeMenu();
    alert("Du hast nur Zugriff auf Startseite, Kabellager, Mast Runner und Profil.");
    return;
  }

  closeMenu();
  window.location.href = "baustellen.html";
}

function goToArchiv(){
  const user = auth.currentUser;
  if(!user || !isAdminUid(user.uid)){
    closeMenu();
    alert("Archiv ist nur für Administratoren sichtbar.");
    return;
  }

  closeMenu();
  window.location.href = "archiv.html";
}

function goToLogs(){
  const user = auth.currentUser;
  if(!user || !isAdminUid(user.uid)){
    closeMenu();
    alert("Logs sind nur für Administratoren sichtbar.");
    return;
  }

  closeMenu();
  window.location.href = "logs.html";
}


function goToGespart(){
  const user = auth.currentUser;
  if(!user || !canAccessSavingsPage(user.uid)){
    closeMenu();
    alert("Diese Seite ist nur für den freigegebenen Benutzer sichtbar.");
    return;
  }

  closeMenu();
  window.location.href = "gespart.html";
}

function goToKabelReport(){
  closeMenu();
  window.location.href = "kabel-report.html";
}

function goToProfile(){
  closeMenu();
  window.location.href = "profil.html";
}
function toggleLoginPasswordVisibility(){
  const passwordField = document.getElementById("loginPassword");
  const toggleIcon = document.getElementById("loginPasswordToggleIcon");

  if(!passwordField || !toggleIcon){
    return;
  }

  const shouldShowPassword = passwordField.type === "password";
  passwordField.type = shouldShowPassword ? "text" : "password";
  toggleIcon.className = shouldShowPassword ? "fa-regular fa-eye-slash" : "fa-regular fa-eye";
}

function login(){
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  document.getElementById("loginSuccess").style.display = "none";

  authReady.then(() => auth.signInWithEmailAndPassword(email, password))
    .then(() => {
      document.getElementById("loginError").style.display = "none";
      document.getElementById("loginPassword").value = "";
    })
    .catch((error) => {
      console.error("Login Fehler:", error);
      document.getElementById("loginError").style.display = "block";
    });
}

function resetPassword(){
  const currentUser = auth.currentUser;
  const emailInput = document.getElementById("loginEmail");
  const email = (currentUser && currentUser.email) || (emailInput ? emailInput.value.trim() : "");

  if(!email){
    alert("Keine E-Mail verfügbar. Bitte erneut einloggen und später versuchen.");
    return;
  }

  auth.sendPasswordResetEmail(email)
    .then(() => {
      alert(`E-Mail zum Zurücksetzen wurde an ${email} gesendet.`);
    })
    .catch((error) => {
      console.error("Passwort zurücksetzen Fehler:", error);
      alert("Zurücksetzen fehlgeschlagen. Bitte später erneut versuchen.");
    });
}

function logout(){
  closeMenu();

  if(!confirm("Wirklich ausloggen?")){
    return;
  }

  auth.signOut()
    .then(() => {
      window.location.href = "home.html";
    })
    .catch((error) => {
      console.error("Logout Fehler:", error);
      alert("Fehler beim Logout.");
    });
}

function markActiveMenu(){
  const buttons = document.querySelectorAll("#dropdownMenu button");
  buttons.forEach(btn => {
    const page = btn.getAttribute("data-page");
    if(page === "home"){
      btn.classList.add("active-page");
    }
  });
}

function formatInfoDate(dateString){
  if(!dateString){
    return "";
  }

  const date = new Date(dateString);
  if(Number.isNaN(date.getTime())){
    return "";
  }

  return date.toLocaleDateString("de-DE", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric"
  });
}

function renderInfoStatus(message){
  const statusElement = document.getElementById("infosStatus");
  if(!statusElement){
    return;
  }

  statusElement.textContent = message;
  statusElement.style.display = "block";
}

function renderHomeInfos(data){
  const titleElement = document.getElementById("infosTitle");
  const metaElement = document.getElementById("infosMeta");
  const listElement = document.getElementById("infosList");
  const statusElement = document.getElementById("infosStatus");

  if(!titleElement || !metaElement || !listElement || !statusElement){
    return;
  }

  statusElement.style.display = "none";
  listElement.innerHTML = "";

  titleElement.textContent = data.title || "Aktuelle Infos";
  const formattedDate = formatInfoDate(data.updatedAt);
  metaElement.textContent = formattedDate ? `Stand: ${formattedDate}` : "";

  const items = Array.isArray(data.items) ? data.items : [];
  if(items.length === 0){
    renderInfoStatus("Noch keine Infos hinterlegt.");
    return;
  }

  items.forEach((item) => {
    const li = document.createElement("li");
    li.textContent = item;
    listElement.appendChild(li);
  });
}

function loadHomeInfos(){
  fetch(HOME_INFOS_URL, { cache: "no-store" })
    .then((response) => {
      if(!response.ok){
        throw new Error(`Infos konnten nicht geladen werden (${response.status}).`);
      }
      return response.json();
    })
    .then((data) => {
      renderHomeInfos(data);
    })
    .catch((error) => {
      console.error("Fehler beim Laden der Infos:", error);
      renderInfoStatus("Infos konnten gerade nicht geladen werden.");
    });
}

document.addEventListener("click", (event) => {
  const menu = document.getElementById("dropdownMenu");
  const wrap = document.querySelector(".menu-wrap");

  if(menu.classList.contains("open") && !wrap.contains(event.target)){
    closeMenu();
  }
});

document.addEventListener("DOMContentLoaded", markActiveMenu);
document.addEventListener("DOMContentLoaded", loadHomeInfos);

auth.onAuthStateChanged((user) => {
  if(user){
    setNavigationVisibility(user);
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("appContent").style.display = "block";
  }else{
    setNavigationVisibility(null);
    closeMenu();
    document.getElementById("loginScreen").style.display = "flex";
    document.getElementById("appContent").style.display = "none";
  }
});
</script>

  <footer class="app-footer">© 2026 Martin Gross. Alle Rechte vorbehalten. · <a href="datenschutz.html">Datenschutz</a></footer>
</body>
</html>

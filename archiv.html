const LIMITED_ACCESS_UIDS = ["h8VfDCJ3eTb5GOwjgBzHVck3TEB3", "BVBSpAYOGaWKptCrQ81h8UtW13n2", "UIAvOHFf8QgqJ7UWkPV7CpV88512"];

let unsubscribeBaustellen = null;

let alleBaustellen = [];

function setLogsMenuVisibility(isAdmin){
  const logsButton = document.getElementById("logsMenuButton");
  if(logsButton){
    logsButton.style.display = isAdmin ? "inline-flex" : "none";
  }
}

const ARCHIV_CACHE_KEY = "archiv_snapshot_v1";
const VORLAGEN_CACHE_KEY = "material_vorlagen_cache_v1";
const VORLAGEN_CACHE_MAX_AGE_MS = 1000 * 60 * 60 * 6;

function saveArchivCache(){
  try{
    const cachePayload = {
      savedAt: Date.now(),
      baustellen: alleBaustellen,
      materialien: alleMaterialien
    };

    localStorage.setItem(ARCHIV_CACHE_KEY, JSON.stringify(cachePayload));
  }catch(error){
    console.warn("Archiv-Cache konnte nicht gespeichert werden:", error);
  }
}

function loadArchivCache(){
  try{
    const raw = localStorage.getItem(ARCHIV_CACHE_KEY);
    if(!raw){
      return;
    }

    const parsed = JSON.parse(raw);

    if(!parsed || !Array.isArray(parsed.baustellen) || !Array.isArray(parsed.materialien)){
      return;
    }

    alleBaustellen = parsed.baustellen;
    alleMaterialien = parsed.materialien;
    renderArchiv();
  }catch(error){
    console.warn("Archiv-Cache konnte nicht geladen werden:", error);
  }
}

function getVorlagenFromCache(){
  try{
    const raw = localStorage.getItem(VORLAGEN_CACHE_KEY);
    if(!raw){
      return null;
    }

    const parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.vorlagen)){
      return null;
    }

    const age = Date.now() - Number(parsed.savedAt || 0);
    if(age > VORLAGEN_CACHE_MAX_AGE_MS){
      return null;
    }

    return parsed.vorlagen.map(v => ({
      id: sanitizeInput(v.id || "", 160),
      material: sanitizeInput(v.material || "", 120),
      spontis: sanitizeInput(v.spontis || "", 60),
      link: parseAndNormalizeUrl(v.link || "") || "",
      barcode: sanitizeBarcodeValue(v.barcode || "")
    })).filter(v => v.id);
  }catch(error){
    return null;
  }
}

function saveVorlagenToCache(vorlagen){
  try{
    localStorage.setItem(VORLAGEN_CACHE_KEY, JSON.stringify({
      savedAt: Date.now(),
      vorlagen: (vorlagen || []).map(v => ({
        id: sanitizeInput(v.id || "", 160),
        material: sanitizeInput(v.material || "", 120),
        spontis: sanitizeInput(v.spontis || "", 60),
        link: parseAndNormalizeUrl(v.link || "") || "",
        barcode: sanitizeBarcodeValue(v.barcode || "")
      }))
    }));
  }catch(error){
    console.warn("Vorlagen-Cache konnte nicht gespeichert werden:", error);
  }
}

function setVorlagen(vorlagen){
  alleVorlagen = Array.isArray(vorlagen) ? vorlagen : [];
  renderArchiv();
}

function loadVorlagen(forceRefresh = false){
  if(!forceRefresh){
    const cachedVorlagen = getVorlagenFromCache();
    if(cachedVorlagen && cachedVorlagen.length > 0){
      setVorlagen(cachedVorlagen);
    }
  }

  vorlagenCollection.get().then(snapshot => {
    const loadedVorlagen = snapshot.docs.map(doc => {
      const data = doc.data() || {};
      return {
        id: doc.id,
        ...data,
        link: parseAndNormalizeUrl(data.link || "") || "",
        barcode: sanitizeBarcodeValue(data.barcode || "")
      };
    });

    setVorlagen(loadedVorlagen);
    saveVorlagenToCache(loadedVorlagen);
  }).catch(error => {
    console.error("Fehler Materialvorlagen:", error);
  });
}

function getCurrentUserDisplayName(user){
  if(!user){
    return "";
  }

  const displayName = sanitizeInput(user.displayName || "", 120);
  if(displayName){
    return displayName;
  }

  const emailName = sanitizeInput((user.email || "").split("@")[0] || "", 120);
  return emailName || "Unbekannt";
}

function writeLog(bereich, aktion, objektTyp, objektId, details){
  const user = auth.currentUser;

  return logsCollection.add({
    bereich: bereich,
    aktion: aktion,
    objektTyp: objektTyp,
    objektId: objektId || "",
    benutzerName: getCurrentUserDisplayName(user),
    benutzerEmail: user && user.email ? user.email : "",
    benutzerUid: user && user.uid ? user.uid : "",
    details: details || "",
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).catch(error => {
    console.error("Fehler beim Schreiben des Logs:", error);
  });
}

function sanitizeInput(value, maxLength = 200){
  return String(value || "")
    .replace(/[<>]/g, "")
    .replace(/[\u0000-\u001F\u007F]/g, " ")
    .replace(/\s+/g, " ")
    .trim()
    .slice(0, maxLength);
}

function sanitizeBarcodeValue(value, maxLength = 80){
  return String(value || "")
    .replace(/\D/g, "")
    .slice(0, maxLength);
}

function getBarcodeValueFromSpontis(spontisNummer){
  return sanitizeBarcodeValue(spontisNummer || "");
}

function parseAndNormalizeUrl(rawValue){
  const cleaned = sanitizeInput(rawValue || "", 600);
  if(cleaned === ""){
    return "";
  }

  let value = cleaned;
  if(!/^https?:\/\//i.test(value)){
    value = "https://" + value;
  }

  try{
    const url = new URL(value);
    if(url.protocol !== "http:" && url.protocol !== "https:"){
      return null;
    }
    return url.toString();
  }catch(error){
    return null;
  }
}

function escapeHtml(value){
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function formatFirestoreDate(value){
  if(!value){
    return "";
  }

  try{
    if(typeof value.toDate === "function"){
      return value.toDate().toLocaleDateString("de-CH");
    }

    if(value.seconds){
      return new Date(value.seconds * 1000).toLocaleDateString("de-CH");
    }

    return new Date(value).toLocaleDateString("de-CH");
  }catch(error){
    return "";
  }
}

function getFirestoreTime(value){
  if(!value){
    return 0;
  }

  if(typeof value.toMillis === "function"){
    return value.toMillis();
  }

  if(value.seconds){
    return value.seconds * 1000;
  }

  const timestamp = new Date(value).getTime();
  return Number.isNaN(timestamp) ? 0 : timestamp;
}

function toggleMenu(event){

  const menu = document.getElementById("dropdownMenu");
  if(menu){
    menu.classList.toggle("open");
  }
}

function closeMenu(){
  const menu = document.getElementById("dropdownMenu");
  if(menu){
    menu.classList.remove("open");
  }
}

document.addEventListener("click", function(event){
  const menu = document.getElementById("dropdownMenu");
  const menuWrap = document.querySelector(".menu-wrap");

  if(!menu || !menuWrap){
    return;
  }

  if(!menuWrap.contains(event.target)){
    closeMenu();
  }
});

function toggleLoginPasswordVisibility(){

  if(!passwordField || !toggleIcon){
    return;
  }

  const shouldShowPassword = passwordField.type === "password";
  passwordField.type = shouldShowPassword ? "text" : "password";
  toggleIcon.className = shouldShowPassword ? "fa-regular fa-eye-slash" : "fa-regular fa-eye";
}

function login(){
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;

  authReady.then(() => auth.signInWithEmailAndPassword(email, password))
    .then(() => {
      document.getElementById("loginError").style.display = "none";
      document.getElementById("loginPassword").value = "";
    })
    .catch((error) => {
      console.error("Login Fehler:", error);
      document.getElementById("loginError").style.display = "block";
    });
}

function resetPassword(){
  const currentUser = auth.currentUser;
  const emailInput = document.getElementById("loginEmail");
  const email = (currentUser && currentUser.email) || (emailInput ? emailInput.value.trim() : "");

  if(!email){
    alert("Keine E-Mail verfügbar. Bitte erneut einloggen und später versuchen.");
    return;
  }

  auth.sendPasswordResetEmail(email)
    .then(() => {
      alert(`E-Mail zum Zurücksetzen wurde an ${email} gesendet.`);
    })
    .catch((error) => {
      console.error("Passwort zurücksetzen Fehler:", error);
      alert("Zurücksetzen fehlgeschlagen. Bitte später erneut versuchen.");
    });
}

function logout(){
  closeMenu();

  if(!confirm("Wirklich ausloggen?")){
    return;
  }

  stopListeners();

  auth.signOut()
    .then(() => {
      window.location.href = "home.html";
    })
    .catch((error) => {
      console.error("Logout Fehler:", error);
      alert("Fehler beim Logout.");
    });
}

function stopListeners(){
  if(unsubscribeBaustellen){
    unsubscribeBaustellen();
    unsubscribeBaustellen = null;
  }

  if(unsubscribeMaterial){
    unsubscribeMaterial();
    unsubscribeMaterial = null;
  }
}

auth.onAuthStateChanged((user) => {
  if(user){
    if(hasLimitedAccess(user.uid)){
      closeMenu();
      alert("Du hast nur Zugriff auf Startseite, Kabellager, Mast Runner und Profil.");
      window.location.href = "home.html";
      return;
    }

    isAdminUser = isAdminUid(user.uid);
    const gespartButton = document.getElementById("gespartMenuButton");
    if(gespartButton){
      gespartButton.style.display = canAccessSavingsPage(user.uid) ? "inline-flex" : "none";
    }
    setLogsMenuVisibility(isAdminUser);

    if(!isAdminUser){
      closeMenu();
      alert("Archiv ist nur für Administratoren sichtbar.");
      window.location.href = "home.html";
      return;
    }

    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("appContent").style.display = "block";
    startListeners();
  }else{
    isAdminUser = false;
    setLogsMenuVisibility(false);
    stopListeners();
    window.location.href = "home.html";
  }
});

function startListeners(){
  loadArchivCache();
  loadVorlagen();

  if(!unsubscribeBaustellen){
    unsubscribeBaustellen = baustellenCollection.onSnapshot(snapshot => {
      alleBaustellen = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      saveArchivCache();
      renderArchiv();
    }, error => {
      console.error("Fehler Baustellen:", error);
      alert("Fehler beim Laden der Baustellen.");
    });
  }

  if(!unsubscribeMaterial){
    unsubscribeMaterial = materialCollection.onSnapshot(snapshot => {
      alleMaterialien = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      saveArchivCache();
      renderArchiv();
    }, error => {
      console.error("Fehler Material:", error);
      alert("Fehler beim Laden der Materialien.");
    });
  }
}

function handleArchivSearchInput(){
  archivVisibleCount = ARCHIV_PAGE_SIZE;
  renderArchiv();
}

function resetSearch(){
  document.getElementById("searchInput").value = "";
  archivVisibleCount = ARCHIV_PAGE_SIZE;
  renderArchiv();
}

function loadMoreArchiv(){
  archivVisibleCount += ARCHIV_PAGE_SIZE;
  renderArchiv();
}

function getSuchbegriff(){
  return document.getElementById("searchInput").value.trim().toLowerCase();
}

function materialVonBaustelle(baustelleId){
  return alleMaterialien.filter(m => m.baustelleId === baustelleId);
}

function baustellePasstZurSuche(baustelle){
  const suchbegriff = getSuchbegriff();

  if(suchbegriff === ""){
    return true;
  }

  const name = String(baustelle.name || "").toLowerCase();
  const nummer = String(baustelle.nummer || "").toLowerCase();
  const verantwortlicher = String(baustelle.verantwortlicher || "").toLowerCase();

  const materialien = materialVonBaustelle(baustelle.id);

  const materialPasst = materialien.some(m => {
    const material = String(m.material || "").toLowerCase();
    const anzahl = String(m.anzahl || "").toLowerCase();
    const spontis = String(m.spontis || "").toLowerCase();
    const barcode = getMaterialBarcodeValue(m).toLowerCase();

    return material.includes(suchbegriff) || anzahl.includes(suchbegriff) || spontis.includes(suchbegriff) || barcode.includes(suchbegriff);
  });

  return (
    name.includes(suchbegriff) ||
    nummer.includes(suchbegriff) ||
    verantwortlicher.includes(suchbegriff) ||
    materialPasst
  );
}

function renderArchiv(){
  const container = document.getElementById("archivListe");
  container.innerHTML = "";

  const archivierte = [...alleBaustellen]
    .filter(b => b.status === "archiviert" && baustellePasstZurSuche(b))
    .sort((a, b) => getFirestoreTime(b.archiviertAm || b.abgeschlossenAm) - getFirestoreTime(a.archiviertAm || a.abgeschlossenAm));

  const sichtbareArchivierte = archivierte.slice(0, archivVisibleCount);

  if(archivierte.length === 0){
    container.innerHTML = '<div class="empty-box">Keine archivierten Baustellen gefunden.</div>';
  }else{
    sichtbareArchivierte.forEach(b => container.appendChild(createBaustelleCard(b)));
  }

  const loadMoreButton = document.getElementById("archivLoadMoreButton");
  if(loadMoreButton){
    loadMoreButton.style.display = archivierte.length > sichtbareArchivierte.length ? "inline-flex" : "none";
  }

  document.getElementById("resultInfo").innerText = "Archivierte Baustellen: " + sichtbareArchivierte.length + " von " + archivierte.length;
}

function getVorlageBarcodeBySpontis(spontisNummer){
  const normalizedSpontis = sanitizeInput(spontisNummer || "", 60).toLowerCase();
  if(normalizedSpontis === ""){
    return "";
  }

  const vorlage = alleVorlagen.find(v => sanitizeInput(v.spontis || "", 60).toLowerCase() === normalizedSpontis);
  return vorlage ? sanitizeBarcodeValue(vorlage.barcode || "") : "";
}

function getMaterialBarcodeValue(material){
  return sanitizeBarcodeValue(
    (material && material.barcode) ||
    getVorlageBarcodeBySpontis(material && material.spontis ? material.spontis : "") ||
    getBarcodeValueFromSpontis(material && material.spontis ? material.spontis : "")
  );
}

function getVorlageLinkBySpontis(spontisNummer){
  const normalizedSpontis = sanitizeInput(spontisNummer || "", 60).toLowerCase();
  if(normalizedSpontis === ""){
    return "";
  }

  const vorlage = alleVorlagen.find(v => sanitizeInput(v.spontis || "", 60).toLowerCase() === normalizedSpontis);
  return vorlage ? (parseAndNormalizeUrl(vorlage.link || "") || "") : "";
}

function createBarcodeSvgMarkup(barcodeValue){
  const barcode = sanitizeBarcodeValue(barcodeValue || "");
  if(barcode === ""){
    return "";
  }

  if(typeof JsBarcode !== "function"){
    return `<div class="barcode-number">${escapeHtml(barcode)}</div>`;
  }

  try{
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "barcode-svg");
    JsBarcode(svg, barcode, {
      format: "CODE128",
      displayValue: false,
      margin: 0,
      width: 1.7,
      height: 70
    });
    return svg.outerHTML;
  }catch(error){
    console.error("Barcode konnte nicht gerendert werden:", error);
    return `<div class="barcode-number">${escapeHtml(barcode)}</div>`;
  }
}

function renderBarcodeBlock(barcodeValue, label = "Barcode"){
  const barcode = sanitizeBarcodeValue(barcodeValue || "");
  if(barcode === ""){
    return "";
  }

  return `
    <div class="barcode-block">
      <span class="barcode-label">${escapeHtml(label)}</span>
      <div class="barcode-svg-wrap">${createBarcodeSvgMarkup(barcode)}</div>
      <div class="barcode-number">${escapeHtml(barcode)}</div>
    </div>
  `;
}

function renderSpontisFeld(spontisNummer, link, darfKlicken){
  const spontis = escapeHtml(spontisNummer || "");
  const normalizedLink = parseAndNormalizeUrl(link || "");

  if(!darfKlicken || !normalizedLink){
    return spontis;
  }

  const encodedUrl = encodeURIComponent(normalizedLink);
  return `<span class="spontis-link" data-encoded-url="${escapeHtml(encodedUrl)}">${spontis}</span>`;
}

function openSpontisLink(encodedUrl){
  if(!isAdminUser){
    return;
  }

  const url = decodeURIComponent(encodedUrl || "");
  const normalizedUrl = parseAndNormalizeUrl(url);
  if(!normalizedUrl){
    return;
  }

  window.open(normalizedUrl, "_blank", "noopener,noreferrer");
}

function createBaustelleCard(baustelle){
  const card = document.createElement("div");
  card.className = "baustelle-card";

  const materialien = materialVonBaustelle(baustelle.id);
  const isOpen = openMaterialLists[baustelle.id] === true;
  const abgeschlossenText = formatFirestoreDate(baustelle.abgeschlossenAm);
  const archiviertText = formatFirestoreDate(baustelle.archiviertAm);

  let materialHtml = "";
  if(materialien.length === 0){
    materialHtml = '<div class="empty-box">Keine Materialdaten vorhanden.</div>';
  }else{
    materialien.forEach(m => {
      materialHtml += `
        <div class="material-item">
          <div class="material-row"><strong>Material:</strong> ${escapeHtml(m.material || "")}</div>
          <div class="material-row"><strong>Anzahl:</strong> ${escapeHtml(m.anzahl || "")}</div>
          <div class="material-row"><strong>Spontis Nummer:</strong> ${renderSpontisFeld(m.spontis || "", getVorlageLinkBySpontis(m.spontis || ""), isAdminUser)}</div>
          ${renderBarcodeBlock(getMaterialBarcodeValue(m), "Barcode")}
        </div>
      `;
    });
  }

  card.innerHTML = `
    <div class="badge badge-archiviert">Archiviert</div>
    <h3>${escapeHtml(baustelle.name || "")}</h3>
    <div class="baustelle-meta"><strong>Baustellen Nummer:</strong> ${escapeHtml(baustelle.nummer || "")}</div>
    <div class="baustelle-meta"><strong>Verantwortlicher:</strong> ${escapeHtml(baustelle.verantwortlicher || "")}</div>
    ${abgeschlossenText ? `<div class="baustelle-meta"><strong>Abgeschlossen am:</strong> ${escapeHtml(abgeschlossenText)}</div>` : ""}
    ${archiviertText ? `<div class="baustelle-meta"><strong>Archiviert am:</strong> ${escapeHtml(archiviertText)}</div>` : ""}

    <div class="card-actions">
      <button type="button" class="print-btn js-print-baustelle"><i class="fa-solid fa-print"></i> Drucken</button>
      ${isAdminUser ? `<button type="button" class="delete js-delete-baustelle"><i class="fa-solid fa-trash"></i> Löschen</button>` : ""}
    </div>

    <div class="material-box">
      <button type="button" class="material-toggle js-toggle-material-list">
        <span><i class="fa-solid fa-list-check"></i> Materialliste</span>
        <span class="arrow">${isOpen ? "▲" : "▼"}</span>
      </button>

      <div class="material-content" id="materialContent_${baustelle.id}" style="display:${isOpen ? "block" : "none"};">
        ${materialHtml}
      </div>
    </div>
  `;

  const printButton = card.querySelector(".js-print-baustelle");
  if(printButton){
    printButton.addEventListener("click", function(){
      printBaustelle(baustelle.id);
    });
  }
  const deleteButton = card.querySelector(".js-delete-baustelle");
  if(deleteButton){
    deleteButton.addEventListener("click", function(){
      deleteBaustelle(baustelle.id);
    });
  }
  const toggleButton = card.querySelector(".js-toggle-material-list");
  if(toggleButton){
    toggleButton.addEventListener("click", function(){
      toggleMaterialList(baustelle.id);
    });
  }
  card.querySelectorAll(".spontis-link[data-encoded-url]").forEach(function(linkElement){
    linkElement.addEventListener("click", function(){
      openSpontisLink(linkElement.dataset.encodedUrl || "");
    });
  });

  return card;
}

function toggleMaterialList(baustelleId){
  const content = document.getElementById("materialContent_" + baustelleId);
  if(!content){
    return;
  }

  openMaterialLists[baustelleId] = !openMaterialLists[baustelleId];
  renderArchiv();
}

function markActiveMenu(){
  const path = window.location.pathname.toLowerCase();
  let currentPage = "";

  if(path.includes("index")){
    currentPage = "index";
  }else if(path.includes("home")){
    currentPage = "home";
  }else if(path.includes("baustellen")){
    currentPage = "baustellen";
  }else if(path.includes("archiv")){
    currentPage = "archiv";
  }else if(path.includes("kabel-report")){
    currentPage = "kabelreport";
  }else if(path.includes("logs")){
    currentPage = "logs";
  }else if(path.includes("gespart")){
    currentPage = "gespart";
  }

  const buttons = document.querySelectorAll("#dropdownMenu button");

  buttons.forEach(btn => {
    const page = btn.getAttribute("data-page");
    if(page === currentPage){
      btn.classList.add("active-page");
    }
  });
}

document.addEventListener("DOMContentLoaded", markActiveMenu);
function deleteBaustelle(id){
  if(!isAdminUser){
    alert("Nur Admins dürfen archivierte Baustellen löschen.");
    return;
  }

  const b = alleBaustellen.find(x => x.id === id);
  if(!b){
    alert("Baustelle nicht gefunden.");
    return;
  }

  const text =
    "Archivierte Baustelle wirklich löschen?\n\n" +
    "Name: " + sanitizeInput(b.name || "", 120) + "\n" +
    "Nummer: " + sanitizeInput(b.nummer || "", 60) + "\n\n" +
    "Auch die Materialliste dieser Baustelle wird gelöscht.";

  if(confirm(text)){
    const materialien = materialVonBaustelle(id);

    if(materialien.length > 499){
      alert("Zu viele Materialeinträge für einen sicheren Sammel-Löschvorgang. Bitte zuerst Material reduzieren.");
      return;
    }

    const batch = db.batch();
    batch.delete(baustellenCollection.doc(id));
    materialien.forEach(m => {
      batch.delete(materialCollection.doc(m.id));
    });

    batch.commit()
      .then(() => {
        writeLog(
          "Baustellenmaterial",
          "Archivierte Baustelle gelöscht",
          "baustelle",
          id,
          "Name: " + (b.name || "") +
          " | Nummer: " + (b.nummer || "") +
          " | Verantwortlicher: " + (b.verantwortlicher || "") +
          " | Gelöschte Materialeinträge: " + materialien.length
        );
      })
      .catch(error => {
        console.error("Fehler beim Löschen der Baustelle:", error);
        alert("Fehler beim Löschen.");
      });
  }
}
